<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css?v=4"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre";try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){}</script><title>Drive · Chartreuse</title></head><body>
<main><h1 class="grad">Drive</h1><p class="sub">Fichiers partagés (3 Mo max par fichier) et galerie photo liée.</p>
<div class="tabs"><button id="t_f" onclick="tb('f')">📁 Fichiers</button><button id="t_g" onclick="tb('g')">🖼️ Galerie</button></div>
<section class="card" id="up" style="display:none"><h2>Importer</h2><input id="fo" list="fl" placeholder="Dossier (ex : Contrats)"><datalist id="fl"></datalist><input type="file" id="fi" multiple><button id="ub" onclick="upl()">Envoyer</button></section>
<div id="v"></div></main>
<script src="config.js?v=4"></script><script src="data.js?v=4"></script><script src="auth.js?v=4"></script><script>
const $=i=>document.getElementById(i);let me,DR={},T="f",fold="",lim=24;
const canUp=()=>me.role=="admin"||me.role=="editeur";
boot("d","drive").then(s=>{me=s;DB.watch("drive",o=>{DR=o||{};draw()},5000);tb("f")});
function tb(t){T=t;$("t_f").className=t=="f"?"on":"";$("t_g").className=t=="g"?"on":"";$("up").style.display=canUp()?"":"none";$("fo").style.display=t=="f"?"":"none";draw()}
const ic=t=>t.startsWith("image/")?"🖼️":t.startsWith("video/")?"🎬":t.startsWith("audio/")?"🎵":/pdf/.test(t)?"📕":/sheet|excel|csv/.test(t)?"📊":/word|document/.test(t)?"📝":/presentation|powerpoint/.test(t)?"🎞️":/zip|rar/.test(t)?"🗜️":"📄";
function draw(){if(!me)return;const a=Object.entries(DR).sort((x,y)=>y[1].ts-x[1].ts),fl=[...new Set(a.map(x=>x[1].f||"").filter(Boolean))];
$("fl").innerHTML=fl.map(f=>`<option value="${esc(f)}">`).join("");
if(T=="f"){const b=a.filter(([k,v])=>!fold||(v.f||"")==fold);$("v").innerHTML=`<div class="chips"><button class="chip ${fold?"":"on"}" onclick="fold='';draw()">Tout</button>${fl.map(f=>`<button class="chip ${fold==f?"on":""}" onclick="fold='${esc(f).replace(/'/g,"")}';draw()">📂 ${esc(f)}</button>`).join("")}</div><div class="card">${b.map(([k,v])=>`<div class="row"><div>${ic(v.t||"")} <b>${esc(v.n)}</b><br><small class="mu">${bytes(v.sz||0)} · ${esc(v.u||v.by)} · ${new Date(v.ts).toLocaleDateString("fr-FR")}${v.f?" · 📂 "+esc(v.f):""}</small></div><span><button class="g" onclick="dl('${k}')">⬇️</button>${v.by==me.key||me.role=="admin"?`<button class="d" onclick="rmd('${k}')">🗑</button>`:""}</span></div>`).join("")||'<p class="mu">Aucun fichier.</p>'}</div>`}
else{const im=a.filter(([k,v])=>/^(image|video)\//.test(v.t||"")),sh=im.slice(0,lim);$("v").innerHTML=`<div class="gal">${sh.map(([k,v])=>`<span data-f="${v.fid}"></span>`).join("")||'<p class="mu">Aucune photo.</p>'}</div>${im.length>lim?'<p style="margin-top:12px"><button onclick="lim+=24;draw()">Voir plus</button></p>':""}`;hydrate($("v"))}}
async function upl(){const fs=[...$("fi").files];if(!fs.length)return;$("ub").disabled=true;$("ub").textContent="Envoi…";let ko=0;for(const f of fs){try{const fid=await upFile(f);await DB.put("drive/"+DB.id(),{fid,n:f.name,t:f.type||"application/octet-stream",sz:f.size,by:me.key,u:me.name,ts:Date.now(),f:T=="g"?"Galerie":$("fo").value.trim()})}catch(e){ko++;alert(f.name+" : "+e.message)}}$("fi").value="";$("ub").disabled=false;$("ub").textContent="Envoyer";DR=await DB.get("drive")||{};draw()}
async function dl(k){const v=DR[k],f=await fileGet(v.fid);if(!f)return alert("Fichier indisponible");const a=document.createElement("a");a.href=f.u;a.download=v.n;a.click()}
async function rmd(k){if(!confirm("Supprimer ?"))return;await DB.del("files/"+DR[k].fid).catch(()=>{});await DB.del("drive/"+k);DR=await DB.get("drive")||{};draw()}
</script></body></html>
