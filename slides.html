<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css?v=4"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre";try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){}</script><title>Présentation · Chartreuse</title></head><body>
<main style="max-width:1000px"><input id="ti" style="font-size:1.3rem;font-weight:700" placeholder="Titre">
<div class="tb noprint" id="tb"><button onclick="addS()">➕ Diapo</button><button onclick="dup()">⧉ Dupliquer</button><button onclick="mvS(-1)">◀</button><button onclick="mvS(1)">▶</button><button class="d" onclick="delS()">🗑</button><button onclick="present()">▶️ Présenter</button><button onclick="window.print()">🖨️ PDF</button></div>
<div class="rail noprint" id="rail"></div><div id="pv" style="margin-bottom:12px"></div>
<section class="card noprint" id="ed"><select id="ly" onchange="up('ly',this.value)"><option value="c">Titre + puces</option><option value="t">Titre centré</option><option value="i">Titre + image + puces</option></select><input id="t" placeholder="Titre de la diapo" oninput="up('t',this.value)"><textarea id="b" rows="5" placeholder="Une ligne = une puce" oninput="up('b',this.value)"></textarea>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><label class="mu">Fond <input type="color" id="bg" style="width:50px;padding:2px;vertical-align:middle" oninput="up('bg',this.value)"></label><label class="mu">Texte <input type="color" id="co" style="width:50px;padding:2px;vertical-align:middle" oninput="up('c',this.value)"></label><button onclick="$('im').click()">🖼️ Image</button><button class="g" onclick="up('img','')">Retirer l'image</button><input type="file" id="im" accept="image/*" hidden></div></section>
<small class="mu noprint" id="st"></small></main>
<script src="config.js?v=4"></script><script src="data.js?v=4"></script><script src="auth.js?v=4"></script><script src="office.js?v=4"></script><script>
const $=i=>document.getElementById(i);let me,id,M,L=[],cur=0,ro=false;
const hex=(c,d)=>/^#[0-9a-f]{3,8}$/i.test(c||"")?c:d;
const sh=s=>{const ls=(s.b||"").split("\n").filter(x=>x.trim()),body=s.ly=="t"?`<p style="font-size:1.4em">${esc(ls.join(" "))}</p>`:`<ul>${ls.map(l=>`<li>${esc(l.replace(/^-\s*/,""))}</li>`).join("")}</ul>`;return `<div class="sl ${s.ly=="t"?"t":""}" style="background:${hex(s.bg,"#1a1a2e")};color:${hex(s.c,"#fff")}"><h2>${esc(s.t)}</h2>${s.ly=="i"&&/^data:image\//.test(s.img||"")?`<img src="${s.img}">`:""}${body}</div>`};
const sv=debounce(()=>ofSave(id,{...M,t:$("ti").value||M.t},{l:L}));
boot("o","office").then(async s=>{me=s;id=new URLSearchParams(location.search).get("id");const r=await ofLoad(id);if(!r){document.querySelector("main").innerHTML='<p class="mu">Introuvable.</p>';return}M=r.m;L=r.c.l&&r.c.l.length?r.c.l:[{t:"Titre",b:"",bg:"#1a1a2e",c:"#ffffff",ly:"c"}];$("ti").value=M.t;ro=!canEd(M,me);if(ro){$("tb").style.display="none";$("ed").style.display="none";$("ti").disabled=true;stSet("Lecture seule")}draw()});
$("ti").addEventListener("input",()=>{if(!ro)sv()});
function fit(el){el.style.setProperty("--fs",el.clientWidth/50+"px")}
function draw(){$("rail").innerHTML=L.map((s,i)=>`<div class="${i==cur?"on":""}" onclick="cur=${i};draw()">${sh(s)}</div>`).join("");document.querySelectorAll("#rail .sl").forEach(e=>e.style.setProperty("--fs","2.4px"));
$("pv").innerHTML=sh(L[cur]);fit($("pv").firstChild);const s=L[cur];$("ly").value=s.ly||"c";$("t").value=s.t||"";$("b").value=s.b||"";$("bg").value=hex(s.bg,"#1a1a2e");$("co").value=hex(s.c,"#ffffff")}
function up(k,v){if(ro)return;L[cur][k]=v;sv();if(k=="ly"||k=="img"){draw()}else{$("pv").innerHTML=sh(L[cur]);fit($("pv").firstChild);const r=$("rail").children[cur];if(r)r.innerHTML=sh(L[cur])}document.querySelectorAll("#rail .sl").forEach(e=>e.style.setProperty("--fs","2.4px"))}
function addS(){L.splice(cur+1,0,{t:"Nouvelle diapo",b:"- ",bg:L[cur].bg,c:L[cur].c,ly:"c"});cur++;sv();draw()}
function dup(){L.splice(cur+1,0,{...L[cur]});cur++;sv();draw()}
function delS(){if(L.length<2)return;if(!confirm("Supprimer cette diapo ?"))return;L.splice(cur,1);cur=Math.max(0,cur-1);sv();draw()}
function mvS(d){const j=cur+d;if(j<0||j>=L.length)return;[L[cur],L[j]]=[L[j],L[cur]];cur=j;sv();draw()}
$("im").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await shrink(f);L[cur].ly="i";L[cur].img=d;sv();draw()}catch(x){alert("Image illisible")}e.target.value=""};
function present(){let i=cur;const o=document.createElement("div");o.className="pres";const r=()=>{o.innerHTML=sh(L[i])+`<small>${i+1}/${L.length} · Esc pour quitter</small>`;fit(o.firstChild)};
const key=e=>{if(e.key=="Escape")close();else if(["ArrowRight"," ","PageDown"].includes(e.key))nxt(1);else if(["ArrowLeft","PageUp"].includes(e.key))nxt(-1)},nxt=d=>{i=Math.min(L.length-1,Math.max(0,i+d));r()},close=()=>{o.remove();removeEventListener("keydown",key)};
let x0=0;o.ontouchstart=e=>x0=e.touches[0].clientX;o.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)nxt(d<0?1:-1);else nxt(1)};addEventListener("keydown",key);document.body.append(o);r();addEventListener("resize",r);if(o.requestFullscreen)o.requestFullscreen().catch(()=>{});o.ondblclick=close}
</script></body></html>
