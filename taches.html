<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre"</script><title>Tâches · Chartreuse</title></head><body>
<main><h1 class="grad">Tâches</h1><p class="sub">Coche ce que tu as terminé.</p><div class="card" id="tk"></div></main>
<script src="config.js"></script><script src="data.js"></script><script src="auth.js"></script><script>
let me;boot("t","taches").then(s=>{me=s;DB.watch("tasks",draw,4000)});
const nm=()=>Object.values(USR).filter(u=>u.role!="admin").length;
async function draw(o){await users();const today=new Date().toISOString().slice(0,10),a=Object.entries(o||{}).filter(([k,v])=>vis(v,me)).sort((x,y)=>(!!(x[1].done||{})[me.key]-!!(y[1].done||{})[me.key])||(x[1].due||"9").localeCompare(y[1].due||"9"));
tk.innerHTML=a.map(([k,v])=>{const d=v.done||{},mine=!!d[me.key],n=v.to&&v.to!="all"?v.to.split(",").length:nm(),late=v.due&&v.due<today&&!mine;
return `<div class="task ${mine?"ok":""}">${me.role=="admin"?"":`<input type="checkbox" ${mine?"checked":""} onchange="tg('${k}',this.checked)">`}<div><b>${esc(v.title)}</b><p class="mu">${esc(v.desc||"")}</p><small class="${late?"late":"mu"}">${v.due?"📅 "+new Date(v.due).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):""}${me.role=="admin"?" · "+Object.keys(d).length+"/"+n+" faits":""}</small></div></div>`}).join("")||'<p class="mu">Aucune tâche 🎉</p>'}
async function tg(k,c){const p=`tasks/${k}/done/${me.key}`;c?await DB.put(p,true):await DB.del(p);draw(await DB.get("tasks"))}
</script></body></html>
