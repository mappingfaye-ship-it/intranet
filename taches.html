<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre"</script><title>Tâches · Chartreuse</title></head><body>
<main><h1 class="grad">Tâches</h1><p class="sub">Coche ce que tu as terminé.</p><div class="card" id="tk"></div></main>
<script src="config.js?v=3"></script><script src="data.js?v=3"></script><script src="auth.js?v=3"></script><script>
let me;boot("t","taches").then(s=>{me=s;DB.watch("tasks/"+s.key,draw,4000)});
function draw(o){const today=new Date().toISOString().slice(0,10),a=Object.entries(o||{}).sort((x,y)=>(!!x[1].done-!!y[1].done)||(x[1].due||"9").localeCompare(y[1].due||"9"));
document.getElementById("tk").innerHTML=a.map(([k,v])=>{const late=v.due&&v.due<today&&!v.done;return `<div class="task ${v.done?"ok":""}"><input type="checkbox" ${v.done?"checked":""} onchange="tg('${k}',this.checked)"><div><b>${esc(v.title)}</b><p class="mu">${esc(v.desc||"")}</p><small class="${late?"late":"mu"}">${v.due?"📅 "+new Date(v.due).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):""}</small></div></div>`}).join("")||'<p class="mu">Aucune tâche 🎉</p>'}
async function tg(k,c){const p=`tasks/${me.key}/${k}/done`;c?await DB.put(p,true):await DB.del(p);draw(await DB.get("tasks/"+me.key))}
</script></body></html>
