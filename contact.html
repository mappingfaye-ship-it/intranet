<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css?v=4"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre";try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){}</script><title>Contact · Chartreuse</title></head><body>
<main style="max-width:560px"><h1 class="grad">Nous contacter</h1><p class="sub">Un message pour l'équipe du projet de mapping de la Chartreuse.</p>
<section class="card"><input id="n" placeholder="Ton nom"><input id="e" type="email" placeholder="Ton e-mail (pour te répondre)"><textarea id="m" rows="6" placeholder="Ton message"></textarea><input id="hp" style="display:none" tabindex="-1" autocomplete="off"><button id="b" onclick="send()">Envoyer</button><p class="mu" id="r" style="margin-top:10px"></p></section>
<p class="mu"><a href="index.html" style="color:var(--c2)">← Retour à la connexion</a></p></main>
<script src="config.js?v=4"></script><script src="data.js?v=4"></script><script src="auth.js?v=4"></script><script>
const $=i=>document.getElementById(i);
async function send(){if($("hp").value)return;if(!$("n").value.trim()||!$("m").value.trim())return alert("Nom et message requis");$("b").disabled=true;try{await DB.pubPut("contact/"+DB.id(),{name:$("n").value.slice(0,100),email:$("e").value.slice(0,200),msg:$("m").value.slice(0,1900),ts:Date.now()});$("r").textContent="Message envoyé ✅ Merci !";$("m").value=""}catch(e){$("r").textContent="Envoi impossible, réessaie plus tard."}$("b").disabled=false}
</script></body></html>
