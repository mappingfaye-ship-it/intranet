<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre"</script><title>Initialisation · Chartreuse</title></head><body>
<main><h1 class="grad">Initialisation</h1><p class="sub">À faire une seule fois, puis supprime ce fichier du dépôt.</p>
<section class="card"><h2>Comptes administrateurs</h2><p class="mu" style="margin-bottom:10px">Choisis deux codes différents de 10 chiffres. Admin = ton compte, Backup = compte de secours.</p>
<input id="pa" inputmode="numeric" maxlength="10" placeholder="Code Admin (10 chiffres)"><input id="pb" inputmode="numeric" maxlength="10" placeholder="Code Backup (10 chiffres)"><button id="go" onclick="init()">Initialiser</button>
<pre id="out" style="margin-top:14px;white-space:pre-wrap;line-height:1.6"></pre></section></main>
<script src="config.js?v=3"></script><script src="data.js?v=3"></script><script src="auth.js?v=3"></script><script>
const $=i=>document.getElementById(i),log=t=>$("out").textContent+=t+"\n";
const NAMES=["MelvynBaure","DorianWurtz","EthanMorgado","PaulBancel","PaulLauranson","NicolasMorgado","SandraMathiaud"];
const SEED={updates:{u1:{ts:1791417600000,date:"Jeudi 8 octobre",title:"Retour du jeudi 8 octobre",body:"## 📽️ Matériel\n- Nous avons en notre possession le vidéoprojecteur **Christie Mirage DS+10K-M** : 11 000 lumens (10 500 en bordure, 11 500 en pointe).\n- Environ **60 nits** d'éclairage, soit environ **11 000 lumens**, du **jeudi 9h au vendredi 9h**.\n- La licence **MadMapper** est achetée et en notre possession.\n## 🎵 SACEM\n- La Chartreuse est bien couverte par la SACEM, comme vu avec Mme Mathiaud aujourd'hui.\n## 🛠️ Séance d'entraînement\n- Elle devrait se dérouler la semaine prochaine pour prendre les mesures et commencer à créer les quads.\n- Salle de référence : **PO5**, accessible tous les mercredis après-midi (horaires de perm ou le soir à voir).\n## 🗓️ Déroulement du jour J\n- **17h45** : système opérationnel et fonctionnel, aucun câble qui dépasse.\n- **18h** : les invités entrent dans la salle polyvalente d'accueil.\n- **19h** : fin, et début du mapping à une heure X lancée au talkie-walkie.\n- Le mapping sera rediffusé le **6 décembre** pour les portes ouvertes."}},
events:{e1:{ord:1,when:"Jeudi 8 octobre",title:"Point d'avancement",desc:"Projecteur Christie récupéré, licence MadMapper achetée, SACEM validée."},e2:{ord:2,when:"Mercredi après-midi · salle PO5",title:"Séance d'entraînement (semaine prochaine)",desc:"Prise de mesures et début de création des quads."},e3:{ord:3,when:"Jour J · jeudi 9h → vendredi 9h",title:"Période du vidéoprojecteur",desc:"≈ 60 nits, soit environ 11 000 lumens."},e4:{ord:4,when:"Jour J · 17h45",title:"Système opérationnel",desc:"Tout fonctionnel, aucun câble qui dépasse."},e5:{ord:5,when:"Jour J · 18h",title:"Entrée des invités",desc:"Salle polyvalente d'accueil."},e6:{ord:6,when:"Jour J · 19h",title:"Fin et début du mapping",desc:"Lancement à l'heure X, donnée au talkie-walkie."},e7:{ord:7,when:"6 décembre",title:"Portes ouvertes",desc:"Rediffusion du mapping."}}};
async function init(){const a=$("pa").value,b=$("pb").value;if(!DB.ok)return alert("Remplis d'abord config.js");if(!/^\d{10}$/.test(a)||!/^\d{10}$/.test(b))return alert("10 chiffres pour chaque code");if(a==b)return alert("Les deux codes doivent être différents");
$("go").disabled=true;$("out").textContent="";
try{const j=await fbAuth("signUp",emailOf("admin",0),a);Auth.save({rt:j.refreshToken,idt:j.idToken,exp:Date.now()+j.expiresIn*1000,uid:j.localId});
await DB.put("members/"+j.localId,{key:"admin",name:"Admin",role:"admin",perms:DEF_PERMS});localStorage.sess=JSON.stringify({key:"admin",name:"Admin",role:"admin",perms:DEF_PERMS,uid:j.localId});log("✔ Admin créé");
await users();await createUser("backup","Backup","admin",b);log("✔ Backup créé");
const out=[];for(const n of NAMES){const p=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e6).padStart(6,"0");await createUser(n.toLowerCase(),n,"membre",p);out.push(n+" : "+p)}log("✔ Membres créés");
for(const c in SEED)for(const id in SEED[c])await publish(c,id,SEED[c][id],"all");log("✔ Contenu de départ publié");
log("\nCODES DES MEMBRES (note-les maintenant, ils ne seront plus affichés) :\n"+out.join("\n")+"\n\nAdmin et Backup : les codes à 10 chiffres que tu viens de choisir.\nSupprime setup.html du dépôt, puis connecte-toi : index.html")}
catch(e){log("✖ "+(e.message=="EMAIL_EXISTS"?"Déjà initialisé (compte admin existant).":e.message));$("go").disabled=false}}
</script></body></html>
