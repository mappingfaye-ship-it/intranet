<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre";try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){}</script><title>Mail · Chartreuse</title></head><body>
<main><h1 class="grad">Messagerie</h1><p class="sub">Messages privés, plus formels, avec pièces jointes.</p>
<div class="tabs"><button id="t_in" onclick="view('in')">📥 Reçus</button><button id="t_sent" onclick="view('sent')">📤 Envoyés</button><button id="t_new" onclick="view('new')">✏️ Nouveau</button></div>
<div id="ml"></div>
<section class="card" id="cp" style="display:none"><h2>Nouveau message</h2><p class="mu" style="margin-bottom:6px">Destinataires :</p><div class="chk" id="rc"></div><input id="ms" placeholder="Objet"><textarea id="mb" rows="8" placeholder="Message (## titre, - puce, **gras**)"></textarea><p class="mu" style="margin-bottom:6px">Pièces jointes (tous formats, 3 Mo max chacune)</p><input type="file" id="mf" multiple><button id="sm" onclick="sendM()">Envoyer</button></section></main>
<script src="config.js?v=4"></script><script src="data.js?v=4"></script><script src="auth.js?v=4"></script><script>
const $=i=>document.getElementById(i);let me,tabk="in",MB={},SN={},op=null;
boot("e","mail").then(async s=>{me=s;await users();$("rc").innerHTML=Object.entries(USR).filter(([k])=>k!=me.key).map(([k,u])=>`<label><input type="checkbox" class="rc" value="${k}"> ${esc(u.name)}</label>`).join("");await load();view("in");setInterval(async()=>{await load();if(tabk!="new")list()},6000)});
async function load(){MB=await DB.get("mail/"+me.key)||{};SN=await DB.get("sent/"+me.key)||{}}
function view(t){tabk=t;op=null;for(const x of["in","sent","new"])$("t_"+x).className=x==t?"on":"";$("ml").style.display=t=="new"?"none":"";$("cp").style.display=t=="new"?"":"none";if(t!="new")list()}
function list(){const a=Object.entries(tabk=="in"?MB:SN).sort((x,y)=>y[1].ts-x[1].ts);
$("ml").innerHTML=a.map(([id,v])=>{const o=op==id,un=tabk=="in"&&!v.read;return `<div class="card mail ${un?"un":""}"><div onclick="opn('${id}')"><b>${esc(tabk=="in"?v.fromName:"À : "+Object.values(v.to||{}).join(", "))}</b> <small class="mu">${new Date(v.ts).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</small><div>${un?"● ":""}${esc(v.subj)}</div></div>${o?`<div class="mbody">${fmt(v.body)}<div class="mu" id="rs"></div>${attHTML(A(v))}<p style="margin-top:12px">${tabk=="in"?`<button onclick="reply('${id}')">↩︎ Répondre</button> `:""}<button class="d" onclick="rmm('${id}')">🗑 Supprimer</button></p></div>`:""}</div>`}).join("")||'<p class="mu">Aucun message.</p>';hydrate($("ml"))}
async function opn(id){op=op==id?null:id;list();if(tabk=="sent"&&op)rstat(id);if(tabk=="in"&&MB[id]&&!MB[id].read){MB[id].read=true;await DB.put(`mail/${me.key}/${id}/read`,Date.now());unread();list()}}
async function rmm(id){if(!confirm("Supprimer ?"))return;await DB.del(`${tabk=="in"?"mail":"sent"}/${me.key}/${id}`);await load();list()}
function reply(id){const v=MB[id];view("new");document.querySelectorAll(".rc").forEach(c=>c.checked=c.value==v.from);$("ms").value=/^Re:/.test(v.subj)?v.subj:"Re: "+v.subj;scrollTo(0,0)}
async function sendM(){const to=[...document.querySelectorAll(".rc:checked")].map(x=>x.value);if(!to.length)return alert("Destinataire ?");if(!$("ms").value.trim())return alert("Objet ?");const b=$("sm");b.disabled=true;b.textContent="Envoi…";
try{const ids=[];for(const f of $("mf").files)ids.push(await upFile(f));const id=DB.id(),v={from:me.key,fromName:me.name,to:to.map(k=>USR[k].name),toK:to,subj:$("ms").value,body:$("mb").value,ts:Date.now()};if(ids.length)v.att=ids;
await Promise.all([...to.map(k=>DB.put(`mail/${k}/${id}`,v)),DB.put(`sent/${me.key}/${id}`,v)]);$("ms").value=$("mb").value=$("mf").value="";document.querySelectorAll(".rc").forEach(c=>c.checked=false);await load();view("sent")}catch(e){alert(e.message)}b.disabled=false;b.textContent="Envoyer"}
async function rstat(id){const v=SN[id],a=[];for(const k of Object.values(v.toK||{})){let r=null;try{r=await DB.get("mail/"+k+"/"+id+"/read")}catch(e){}a.push(((USR[k]||{}).name||k)+" : "+(r?"lu "+new Date(r).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"non lu"))}const e=document.getElementById("rs");if(e)e.textContent=a.join(" · ")}
</script></body></html>
