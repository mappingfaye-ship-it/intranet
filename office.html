<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css?v=4"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre";try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){};try{const p=JSON.parse(localStorage.prefs||"{}"),r=document.documentElement.style;if(p.a)r.setProperty("--c1",p.a);if(p.b)r.setProperty("--c2",p.b);if(p.f)r.fontSize=p.f+"px"}catch(e){}</script><title>Office · Chartreuse</title></head><body>
<main><h1 class="grad">Office</h1><p class="sub">Documents, tableurs et présentations partagés avec l'équipe.</p>
<div class="card"><button onclick="nw('w')">📝 Nouveau document</button> <button onclick="nw('x')">📊 Nouveau tableur</button> <button onclick="nw('p')">🎞️ Nouvelle présentation</button></div>
<div class="card ofl" id="l"></div></main>
<script src="config.js?v=4"></script><script src="data.js?v=4"></script><script src="auth.js?v=4"></script><script src="office.js?v=4"></script><script>
let me;const $=i=>document.getElementById(i);
boot("o","office").then(s=>{me=s;DB.watch("officeidx",o=>{const a=Object.entries(o||{}).sort((x,y)=>y[1].ts-x[1].ts);$("l").innerHTML=a.map(([k,v])=>`<a href="${OP[v.ty]}?id=${k}"><i>${OI[v.ty]}</i><div style="flex:1"><b>${esc(v.t)}</b><br><small class="mu">${ON[v.ty]} · ${esc(v.on)} · ${ago(v.ts)}</small></div>${canEd(v,me)?`<button class="d" onclick="event.preventDefault();rm('${k}')">🗑</button>`:""}</a>`).join("")||'<p class="mu">Aucun fichier. Crées-en un !</p>'},5000)});
async function nw(ty){const t=prompt("Nom du fichier ?",ON[ty]);if(!t)return;const id=DB.id();const c=ty=="w"?{h:"<p>Commence à écrire…</p>"}:ty=="x"?{cells:{},st:{}}:{l:[{t:"Titre",b:"- Premier point",bg:"#1a1a2e",c:"#ffffff",ly:"c"}]};await ofSave(id,{t,ty,o:me.key,on:me.name},c);location.href=OP[ty]+"?id="+id}
async function rm(k){if(!confirm("Supprimer ?"))return;await DB.del("office/"+k);await DB.del("officeidx/"+k)}
</script></body></html>
