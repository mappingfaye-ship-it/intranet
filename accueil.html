<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chartreuse"><meta name="theme-color" content="#0b0b14"><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.theme=localStorage.theme||"sombre"</script><title>Accueil · Chartreuse</title></head><body>
<main><h1 class="grad">Mises à jour</h1><p class="sub">Projet de mapping de la Chartreuse</p><div id="cd"></div><div id="pe"></div><div id="up"></div></main>
<script src="config.js"></script><script src="data.js"></script><script src="auth.js"></script><script>
boot("a").then(s=>{
DB.watch("settings/jourj",j=>{if(!j){cd.innerHTML="";return}const d=Math.ceil((new Date(j)-Date.now())/864e5);cd.innerHTML=`<article class="card cdn"><span>⏳ Jour J</span><strong>${d>0?"J-"+d:d==0?"Aujourd'hui !":"Terminé"}</strong><small>${new Date(j).toLocaleString("fr-FR",{dateStyle:"full",timeStyle:"short"})}</small></article>`},60000);
DB.watch("perso",o=>{o=o||{};const mk=k=>Object.values(o[k]||{}).map(v=>`<li>${inl(v.t)}</li>`).join(""),a=mk(s.key),b=mk("_all");pe.innerHTML=(a?`<article class="card"><h2>👤 Mon espace</h2><ul>${a}</ul></article>`:"")+(b?`<article class="card"><h2>📢 Pour tous</h2><ul>${b}</ul></article>`:"")});
DB.watch("updates",o=>{const a=Object.values(o||{}).filter(v=>vis(v,s)).sort((x,y)=>y.ts-x.ts);up.innerHTML=a.map(v=>`<article class="card"><span class="tag">${esc(v.date)}</span><h2>${esc(v.title)}</h2>${fmt(v.body)}${attHTML(A(v))}</article>`).join("")||'<p class="mu">Aucune mise à jour.</p>';hydrate(up)})});
</script></body></html>
